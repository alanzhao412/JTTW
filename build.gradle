plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = 'com.jttw.engine'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests: in-world tests run by ./gradlew runGameTestServer. A separate source set so
// the test code and its structure files stay out of the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = neo_version

    // Unit tests and GameTests compile against Minecraft too
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gametest

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            // e.g. ./gradlew runGameTestServer -Pgametest.only=guardianlaser,yama -Pgametest.repeat=40
            // (the batches of the tests whose names hold any of the words, each run 40 times over; see ReadyGate)
            systemProperty 'jttw.gametest.only', (project.findProperty('gametest.only') ?: '').toString()
            systemProperty 'jttw.gametest.repeat', (project.findProperty('gametest.repeat') ?: '1').toString()
        }

        // Photographs every transformation form in a real client (see FormGallery)
        formGallery {
            client()
            gameDirectory = project.file('run-gallery')
            systemProperty 'jttw.formGallery', 'true'
            systemProperty 'jttw.backgroundWindow', 'true' // opens behind your work, without focus
            // e.g. ./gradlew runFormGallery -Pgallery.only=block,special
            systemProperty 'jttw.formGallery.only', (project.findProperty('gallery.only') ?: '').toString()
        }

        // Measures world generation and flight look-ahead in a real client (see ChunkBench)
        worldgenBench {
            client()
            gameDirectory = project.file('run-bench')
            systemProperty 'jttw.chunkBench', 'true'
            systemProperty 'jttw.backgroundWindow', 'true'
            // e.g. ./gradlew runWorldgenBench -Pbench.view=6 (the server's view distance, in chunks)
            systemProperty 'jttw.chunkBench.view', (project.findProperty('bench.view') ?: '0').toString()
            // -Pbench.mode=terrain measures the abilities that break terrain instead (see TerrainBench)
            systemProperty 'jttw.chunkBench.mode', (project.findProperty('bench.mode') ?: '').toString()
            // -Pbench.seed=42 makes the bench's world of another seed (12345 by default)
            systemProperty 'jttw.chunkBench.seed', (project.findProperty('bench.seed') ?: '12345').toString()
            // -Pbench.sky=vanilla makes it under vanilla's sky (y 320) instead of the taller one (see TallOverworld)
            systemProperty 'jttw.chunkBench.sky', (project.findProperty('bench.sky') ?: '').toString()
            // -Pbench.open=<save> opens a world already in run-bench/saves instead of making one (an older world, say)
            systemProperty 'jttw.chunkBench.open', (project.findProperty('bench.open') ?: '').toString()
        }

        // An automated play-test in a real client (see ClientPass)
        playtestPass {
            client()
            gameDirectory = project.file('run-playtest')
            systemProperty 'jttw.playtest', 'true'
            systemProperty 'jttw.backgroundWindow', 'true'
        }

        // A real client joining a real dedicated server, started apart on localhost:25599 (see MultiplayerPass)
        multiplayerPass {
            client()
            gameDirectory = project.file('run-mp')
            systemProperty 'jttw.mpPass', 'true'
            systemProperty 'jttw.backgroundWindow', 'true'
            programArguments.addAll '--quickPlayMultiplayer', (project.findProperty('mp.server') ?: 'localhost:25599').toString(),
                    '--username', (project.findProperty('mp.user') ?: 'Tester1').toString()
        }

        // The second player of the multiplayer pass: joins first and watches Tester1 (see MultiplayerPass)
        multiplayerObserver {
            client()
            gameDirectory = project.file('run-mp2')
            systemProperty 'jttw.mpPass', 'true'
            systemProperty 'jttw.mpPass.role', 'observer'
            systemProperty 'jttw.backgroundWindow', 'true'
            programArguments.addAll '--quickPlayMultiplayer', (project.findProperty('mp.server') ?: 'localhost:25599').toString(),
                    '--username', 'Tester2'
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    // ModDevGradle loads a mod from its source sets, so the GameTest code is part of the mod in
    // every dev run; it is still left out of the built jar.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// The dev clients that run on their own open in the background (see WindowMixin): NeoForge's early
// loading window would be made, and take focus, before the mod could say otherwise, so it is off in
// their run directories. They are muted there too.
['runFormGallery': 'run-gallery', 'runWorldgenBench': 'run-bench', 'runPlaytestPass': 'run-playtest', 'runMultiplayerPass': 'run-mp', 'runMultiplayerObserver': 'run-mp2'].each { task, dir ->
    tasks.matching { it.name == task }.configureEach {
        doFirst {
            def toml = project.file("${dir}/config/fml.toml")
            toml.parentFile.mkdirs()
            def text = toml.exists() ? toml.text : ''
            if (text =~ /(?m)^earlyWindowControl\s*=/) {
                text = text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
            } else {
                text = 'earlyWindowControl = false\n' + text
            }
            toml.text = text
            // and they make no sound
            def opts = project.file("${dir}/options.txt")
            def o = opts.exists() ? opts.text : ''
            if (o =~ /(?m)^soundCategory_master:/) {
                o = o.replaceAll(/(?m)^soundCategory_master:.*$/, 'soundCategory_master:0.0')
            } else {
                o = o + (o.isEmpty() || o.endsWith('\n') ? '' : '\n') + 'soundCategory_master:0.0\n'
            }
            opts.text = o
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests: game logic that runs without a Minecraft world.
// Behaviour inside a running world is covered by GameTests (./gradlew runGameTestServer).
tasks.named('test', Test).configure {
    useJUnitPlatform()
    // NeoForge's logging writes a logs/ folder into the working directory; keep it in the build dir
    def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
    workingDir = testRunDir
    doFirst { testRunDir.mkdirs() }
    systemProperty 'jttw.projectDir', projectDir.absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
